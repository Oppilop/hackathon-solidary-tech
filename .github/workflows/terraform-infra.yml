# =============================================================================
# Provisiona toda a infraestrutura AWS do ambiente PRIMÁRIO:
#   - VPC + subnets + NAT
#   - EKS + Node Group (LabRole)
#   - 2 RDS PostgreSQL + DynamoDB (PITR) + SQS + 4 ECR
#   - FinOps: AWS Budgets + Cost Anomaly Detection
#   - DR: bucket S3 de backup do Velero na região secundária
#   - Bootstrap K8s (namespaces, secrets, configmaps, metrics-server, ingress)
#   - ArgoCD + Applications apontando para gitops/
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN
#   TF_STATE_BUCKET             (bucket S3 do tfstate)
#   DD_API_KEY / DD_SITE        (Datadog)
#   PAGERDUTY_INTEGRATION_KEY   (PagerDuty Events API V2)
#   DISCORD_WEBHOOK_URL         (webhook do canal de incidentes)
# =============================================================================

name: Terraform Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação Terraform"
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy]
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "!terraform/dr/**"
      - ".github/workflows/terraform-infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "!terraform/dr/**"

concurrency:
  group: terraform-infra
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  WORKING_DIR: ./terraform
  TF_STATE_KEY: solidarytech/fase5/terraform.tfstate

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1) PLAN
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Garantir bucket S3 do tfstate (idempotente)
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::Secret TF_STATE_BUCKET não definido."
            exit 1
          fi
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Criando bucket $BUCKET..."
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "Bucket $BUCKET já existe — OK."
          fi

      - name: Terraform fmt -check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Gerar terraform.tfvars dinâmico
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region            = "${{ env.AWS_REGION }}"
          gitops_repo_url       = "${{ github.server_url }}/${{ github.repository }}.git"
          aws_access_key_id     = "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key = "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws_session_token     = "${{ secrets.AWS_SESSION_TOKEN }}"
          EOF

      # Limpeza prévia para impedir o erro de leitura do Object Lock durante o Plan
      - name: Limpar Velero Bucket se existir na AWS
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET_NAME="solidarytech-velero-backups-${ACCOUNT_ID}"
          
          echo "Verificando se o bucket $BUCKET_NAME existe..."
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME encontrado. Deletando para permitir o plan limpo..."
            aws s3 rb "s3://${BUCKET_NAME}" --force || true
          else
            echo "Bucket não existe. Prosseguindo."
          fi

      - name: Terraform plan
        id: plan
        env:
          TF_LOG: ERROR
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode -no-color | tee plan.txt
          EXIT=${PIPESTATUS[0]}
          set -e
          case "$EXIT" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Erro no plan"; exit 1 ;;
          esac

      - name: Evidência FinOps — tags que serão aplicadas
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "─── Tags obrigatórias no plan (evidência de FinOps) ───"
          grep -E '"(Project|Environment|CostCenter|Owner|ManagedBy)"' plan.txt \
            | sort -u | head -40 || echo "(nenhuma tag encontrada no diff textual)"

      - name: Upload tfplan (artifact)
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/terraform.tfvars
          retention-days: 7

      - name: Comentar plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.WORKING_DIR }}/plan.txt';
            let plan = '';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
              if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncado)';
            } catch (e) {
              plan = '(plan não disponível)';
            }
            const body = [
              '### Terraform plan',
              `changes detected: \`${{ steps.plan.outputs.has_changes }}\``,
              '',
              '<details><summary>Plan textual</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # 2) APPLY
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
    needs: terraform-plan
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') ||
      (github.event_name == 'push' && needs.terraform-plan.outputs.has_changes == 'true')
    environment:
      name: production
    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Gerar terraform.tfvars
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region            = "${{ env.AWS_REGION }}"
          gitops_repo_url       = "${{ github.server_url }}/${{ github.repository }}.git"
          aws_access_key_id     = "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key = "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws_session_token     = "${{ secrets.AWS_SESSION_TOKEN }}"
          EOF

      - name: Download tfplan (artifact)
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      # Garante limpeza antes do apply direto (ex: em acionamento por workflow_dispatch)
      - name: Garantir ambiente limpo antes do Apply
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ ! -f tfplan ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            BUCKET_NAME="solidarytech-velero-backups-${ACCOUNT_ID}"
            
            echo "Verificando e limpando bucket $BUCKET_NAME antes do apply direto..."
            aws s3 rb "s3://${BUCKET_NAME}" --force || true
          fi

      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ -f tfplan ]; then
            echo "Aplicando plan salvo do job anterior..."
            if ! terraform apply -auto-approve tfplan; then
              echo "::warning::Plan salvo obsoleto (stale). Refazendo plan e aplicando..."
              terraform apply -auto-approve
            fi
          else
            echo "Apply direto (workflow_dispatch)..."
            terraform apply -auto-approve
          fi

      - name: Capturar outputs
        id: outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Sem o "|| true" o -e abortaria aqui e o erro real (output ausente)
          # ficaria escondido atras de um exit code generico.
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || true)

          if [ -z "$CLUSTER" ]; then
            echo "::error::terraform output 'cluster_name' veio vazio."
            echo "Causas usuais: o apply falhou parcialmente, ou o state nao"
            echo "tem o modulo eks. Saida completa de 'terraform output':"
            terraform output || echo "(nenhum output no state)"
            exit 1
          fi

          echo "cluster_name=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "cluster capturado: $CLUSTER"
          echo "─── Outputs principais ───"
          terraform output

  # ═══════════════════════════════════════════════════════════════════════════
  # 3) POST-APPLY — secrets de observabilidade + validação do ArgoCD
  # ═══════════════════════════════════════════════════════════════════════════
  post-apply-check:
    name: Post-Apply Validation (kubectl)
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: needs.terraform-apply.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Update kubeconfig
        run: |
          CLUSTER="${{ needs.terraform-apply.outputs.cluster_name }}"

          if [ -z "$CLUSTER" ]; then
            echo "::error::O job de apply nao exportou 'cluster_name'."
            echo "Sem esse valor o aws eks update-kubeconfig recebe --name vazio"
            echo "e falha com ParamValidation. Verifique o step 'Capturar outputs'."
            exit 1
          fi

          echo "conectando ao cluster: $CLUSTER"
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name "$CLUSTER"

      - name: Esperar ArgoCD ficar pronto
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/argocd-server -n argocd
          kubectl wait --for=condition=available --timeout=300s \
            deployment/argocd-repo-server -n argocd
          echo "ArgoCD pronto."

      # ─────────────────────────────────────────────────────────────────────
      # Secrets que NÃO podem ir para o Git. Criados aqui, antes do ArgoCD
      # sincronizar as Applications de observabilidade.
      # NOTA: o GitHub Actions não permite `secrets.X` em `if:`, por isso o
      # step "gate" abaixo publica flags em outputs.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verificar quais secrets de observabilidade existem
        id: obs-secrets
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          PD_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
        run: |
          [ -n "$DD_API_KEY" ] && echo "has_datadog=true" >> "$GITHUB_OUTPUT" || echo "has_datadog=false" >> "$GITHUB_OUTPUT"
          [ -n "$PD_KEY" ] && echo "has_pagerduty=true" >> "$GITHUB_OUTPUT" || echo "has_pagerduty=false" >> "$GITHUB_OUTPUT"

      - name: Criar secret do Datadog
        if: steps.obs-secrets.outputs.has_datadog == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
        run: |
          kubectl create namespace observability \
            --dry-run=client -o yaml | kubectl apply -f -

          SITE="${DD_SITE:-datadoghq.com}"
          # NORMALIZAÇÃO CRÍTICA: o exporter do Datadog monta as URLs como
          # "https://trace.agent.${SITE}". Se o valor vier com protocolo, gera
          # uma URL quebrada e o Collector DESCARTA toda a telemetria.
          SITE="$(echo "$SITE" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')"
          echo "DD_SITE normalizado: ${SITE}"

          kubectl -n observability create secret generic datadog-secret \
            --from-literal=api-key="${DD_API_KEY}" \
            --from-literal=DD_API_KEY="${DD_API_KEY}" \
            --from-literal=DD_SITE="${SITE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Avisar se a chave do Datadog não estiver configurada
        if: steps.obs-secrets.outputs.has_datadog != 'true'
        run: |
          echo "::warning::DD_API_KEY não definido — o Datadog Agent ficará sem credencial."

      - name: Aplicar config do Alertmanager (PagerDuty + Discord)
        if: steps.obs-secrets.outputs.has_pagerduty == 'true'
        env:
          PD_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          kubectl create namespace observability \
            --dry-run=client -o yaml | kubectl apply -f -

          # Substitui os placeholders do arquivo versionado pelas chaves reais.
          # O arquivo no Git permanece com os placeholders.
          sed -e "s/PAGERDUTY_INTEGRATION_KEY/${PD_KEY}/g" \
              -e "s|DISCORD_WEBHOOK_URL|${DISCORD_URL}|g" \
              gitops/templates/alertmanager-pagerduty-config.template.yaml \
            | kubectl apply -f -
          echo "Secret alertmanager-pagerduty-config aplicado."

      - name: Avisar se a chave do PagerDuty não estiver configurada
        if: steps.obs-secrets.outputs.has_pagerduty != 'true'
        run: |
          echo "::warning::PAGERDUTY_INTEGRATION_KEY não definido — sem abertura automática de incidentes."

      - name: Forçar re-sync das Applications de observabilidade
        if: steps.obs-secrets.outputs.has_datadog == 'true' || steps.obs-secrets.outputs.has_pagerduty == 'true'
        run: |
          for app in observability-stack kube-prometheus-stack datadog velero; do
            kubectl -n argocd annotate application "$app" \
              argocd.argoproj.io/refresh=hard --overwrite 2>/dev/null || true
          done

      - name: Listar Applications do ArgoCD
        run: |
          echo "─── Applications no ArgoCD ───"
          kubectl get applications -n argocd -o wide || \
            echo "(o ArgoCD pode levar alguns segundos para registrar)"

      - name: Aguardar e exibir DNS do NLB (ingress-nginx)
        run: |
          echo "Aguardando NLB ser provisionado..."
          for i in $(seq 1 24); do
            NLB=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$NLB" ]; then
              echo "═════════════════════════════════════════════════════════"
              echo "  URL base da plataforma: http://${NLB}"
              echo ""
              echo "  curl http://${NLB}/api/ngo/health"
              echo "  curl http://${NLB}/api/donation/health"
              echo "  curl http://${NLB}/api/volunteer/health"
              echo "═════════════════════════════════════════════════════════"
              break
            fi
            echo "  tentativa $i/24 — aguardando 10s..."
            sleep 10
          done

      - name: Mascarar senha do ArgoCD nos logs
        run: |
          if PASS=$(kubectl -n argocd get secret argocd-initial-admin-secret \
              -o jsonpath='{.data.password}' 2>/dev/null | base64 -d); then
            echo "::add-mask::$PASS"
            echo "Senha admin do ArgoCD mascarada nos logs."
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 4) DESTROY
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment:
      name: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Limpar Applications do ArgoCD
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          if [ -n "$CLUSTER" ]; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
            kubectl delete applications --all -n argocd --timeout=120s || true
            sleep 30
          fi

      - name: Esvaziar bucket de backup do Velero
        continue-on-error: true
        run: |
          # O bucket tem versionamento: o destroy falha se ele não estiver vazio.
          BUCKET="solidarytech-velero-backups"
          echo "Removendo objetos e versões de $BUCKET..."
          aws s3api list-object-versions --bucket "$BUCKET" \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
            --output json > /tmp/versions.json 2>/dev/null || echo '{}' > /tmp/versions.json
          if [ -s /tmp/versions.json ] && grep -q '"Key"' /tmp/versions.json; then
            aws s3api delete-objects --bucket "$BUCKET" --delete file:///tmp/versions.json || true
          fi

      - name: Gerar terraform.tfvars
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region            = "${{ env.AWS_REGION }}"
          gitops_repo_url       = "${{ github.server_url }}/${{ github.repository }}.git"
          aws_access_key_id     = "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key = "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws_session_token     = "${{ secrets.AWS_SESSION_TOKEN }}"
          EOF

      - name: Terraform destroy
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform destroy -auto-approve

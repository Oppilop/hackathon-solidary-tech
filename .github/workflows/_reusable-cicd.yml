# =============================================================================
# Workflow reutilizável de CI/CD DevSecOps.
#
# Esteira (falha em qualquer etapa bloqueia o deploy):
#   1. Build & Unit Test
#   2. Lint / análise estática
#   3. Security Scan — SCA (Trivy fs) + SAST (gosec / bandit)
#   4. Docker build + scan da imagem (Trivy) + push no ECR
#   5. Bump da tag da imagem no manifesto GitOps  -> ArgoCD sincroniza
#
# Nenhum `kubectl apply` de aplicação: quem entrega é o ArgoCD.
# =============================================================================

name: Reusable CI/CD

on:
  workflow_call:
    inputs:
      service:
        description: "Nome do microsserviço (ngo, donation, volunteer)."
        required: true
        type: string
      language:
        description: "Linguagem do serviço: 'go' ou 'python'."
        required: true
        type: string
      aws_region:
        type: string
        default: "us-east-1"
      ecr_repository:
        description: "Nome do repositório ECR (sem o registry)."
        type: string
        required: true
      gitops_path:
        description: "Caminho do deployment.yaml a ter a imagem atualizada."
        type: string
        required: true
      service_dir:
        description: >-
          Pasta do serviço dentro de services/. Vazio = "services/<service>-service"
          (convenção dos 3 microsserviços). O self-healing-webhook não segue a
          convenção e passa este input explicitamente.
        type: string
        required: false
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      GITOPS_TOKEN:
        required: false

permissions:
  contents: write
  security-events: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1) BUILD & UNIT TEST
  # ───────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go build + test
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          # go mod tidy resolve o go.sum sem precisar versioná-lo.
          go mod tidy
          go build ./...
          go test ./... -count=1 -coverprofile=coverage.out

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python install + test
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          pip install -r requirements.txt
          pip install pytest
          if compgen -G "test_*.py" > /dev/null || [ -d tests ]; then
            pytest -q
          else
            echo "Sem testes para ${{ inputs.service }} — skip."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 2) LINT / ANÁLISE ESTÁTICA
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt + go vet (Go)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          go mod tidy
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Arquivos fora do padrão gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: flake8 (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          pip install flake8
          flake8 . --count --max-line-length=127 \
            --ignore=E302,E305,E261,E701,W291,W292,W293,W391,F401 --statistics

  # ───────────────────────────────────────────────────────────────────────────
  # 3) SECURITY SCAN (SAST + SCA) — DevSecOps
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan (SAST + SCA)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # --- SCA: dependências (filesystem scan) -------------------------------
      - name: SCA — Trivy filesystem (dependências)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: "${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}"
          severity: 'CRITICAL'
          exit-code: '1'                # BLOQUEIA o pipeline em CRITICAL
          ignore-unfixed: true
          format: 'table'

      # --- SAST: código-fonte ------------------------------------------------
      - name: Setup Go (SAST)
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: SAST — gosec (Go)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          go mod tidy
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity=high -fmt=text -stdout ./... ; EXIT=$?
          # exit code 1 = findings; qualquer outro = erro da ferramenta
          if [ "${EXIT}" -eq 1 ]; then
            echo "::error::gosec encontrou vulnerabilidades HIGH/CRITICAL."
            exit 1
          fi

      - name: Setup Python (SAST)
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: SAST — bandit (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}
        run: |
          pip install bandit
          # -lll = só reporta severity HIGH
          bandit -r . -lll -x ./tests || EXIT=$?
          if [ "${EXIT:-0}" -ne 0 ]; then
            echo "::error::bandit encontrou vulnerabilidades com severity HIGH ou superior."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 4) DOCKER BUILD + SCAN DA IMAGEM + PUSH NO ECR
  #    Só em push na main — não publicamos imagem a cada PR.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build + Scan + Push
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_uri: ${{ steps.tag.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (v1.0.0-<sha curto>)
        id: tag
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v1.0.0-${SHORT}"
          URI="${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repository }}:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${URI}" >> $GITHUB_OUTPUT
          echo "Tag final: ${TAG}"

      - name: Docker build
        run: |
          docker build \
            -t ${{ steps.tag.outputs.uri }} \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repository }}:latest \
            ${{ inputs.service_dir != '' && inputs.service_dir || format('services/{0}-service', inputs.service) }}

      - name: Trivy — scan da imagem (CRITICAL bloqueia)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.uri }}
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      - name: Push to ECR
        run: |
          docker push ${{ steps.tag.outputs.uri }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repository }}:latest

  # ───────────────────────────────────────────────────────────────────────────
  # 5) GITOPS — atualiza a tag da imagem no manifesto.
  #    É este commit que faz o ArgoCD sincronizar a nova versão.
  # ───────────────────────────────────────────────────────────────────────────
  update-gitops:
    name: Update GitOps Manifest
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (com permissão de write)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          fetch-depth: 0

      - name: Atualizar a tag da imagem no manifesto
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
          MANIFEST_PATH: ${{ inputs.gitops_path }}
        run: |
          echo "Atualizando $MANIFEST_PATH com a imagem $IMAGE_URI"
          sed -i -E "s|^( *image:).*\$|\1 ${IMAGE_URI}|" "$MANIFEST_PATH"
          echo "── Diff resultante ──"
          git diff "$MANIFEST_PATH" || true

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nada para commitar (tag já estava atualizada)."
            exit 0
          fi
          git add "${{ inputs.gitops_path }}"
          git commit -m "chore(gitops): bump ${{ inputs.service }} para ${{ needs.docker.outputs.image_tag }} [skip ci]"

          # Vários serviços terminam em paralelo e disputam o push; retry com
          # backoff garante que todos gravem sua tag sem quebrar o pipeline.
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            git pull --rebase origin main && git push origin main && break
            if [ $i -eq $MAX_RETRIES ]; then
              echo "::error::Falha ao fazer push após ${MAX_RETRIES} tentativas."
              exit 1
            fi
            SLEEP=$((i * 5))
            echo "Tentativa ${i} falhou — aguardando ${SLEEP}s..."
            sleep $SLEEP
          done

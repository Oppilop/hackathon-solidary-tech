apiVersion: batch/v1
kind: Job
metadata:
  name: ngo-postgres-init
  namespace: ngo-namespace
  annotations:
    # Roda antes do Deployment na mesma sincronização do ArgoCD.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:15-alpine
          command: ["sh", "-c"]
          args:
            - psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -f /mnt/init.sql
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: solidarytech-db-secret, key: DB_HOST } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: solidarytech-db-secret, key: DB_USER } } }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: solidarytech-db-secret, key: DB_NAME } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: solidarytech-db-secret, key: DB_PASSWORD } } }
          volumeMounts:
            - { name: init-sql, mountPath: /mnt }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: init-sql
          configMap:
            name: ngo-postgres-init-cm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ngo-postgres-init-cm
  namespace: ngo-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS ngos (
      id SERIAL PRIMARY KEY,
      name VARCHAR(150) NOT NULL,
      email VARCHAR(100) UNIQUE NOT NULL,
      cause VARCHAR(100) NOT NULL,
      city VARCHAR(100) NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO ngos (name, email, cause, city) VALUES
      ('Anjos de Patas', 'contato@anjosdepatas.org', 'Proteção Animal', 'Osasco'),
      ('Educa Mais', 'info@educamais.org', 'Educação', 'São Paulo')
    ON CONFLICT (email) DO NOTHING;

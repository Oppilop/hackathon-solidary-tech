apiVersion: v1
kind: ConfigMap
metadata:
  name: solidarytech-overview-dashboard
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    # O sidecar do Grafana importa automaticamente todo ConfigMap com este label
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: solidarytech
data:
  solidarytech-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "uid": "solidarytech-overview",
      "title": "SolidaryTech — Visão Geral da Plataforma",
      "tags": [
        "solidarytech",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "🟢 Estado da plataforma",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Pods prontos",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\"}) OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Alvos indisponíveis",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(up{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\"} == 0) OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "RPS total",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\"}[5m])) OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Erro 5xx (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\"}[5m]))) * 100 OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Alertas disparando",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\"}) OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Nodes do cluster",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(kube_node_info) OR vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "📈 Golden Metrics por serviço",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Tráfego (RPS)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\"}[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Taxa de erro 5xx",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "targets": [
            {
              "expr": "(sum by (service) (rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\",http_response_status_code=~\"5..\"}[5m])) / sum by (service) (rate(http_requests_total{service=~\"ngo-service|donation-service|volunteer-service\"}[5m]))) * 100",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Latência p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{service=~\"ngo-service|donation-service|volunteer-service\"}[5m])))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "decimals": 3
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "💰 FinOps — rightsizing: uso real vs. request declarado",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU: uso real vs. request",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "uso — {{namespace}}",
              "refId": "A"
            },
            {
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\",resource=\"cpu\"})",
              "legendFormat": "request — {{namespace}}",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "decimals": 3
            },
            "overrides": []
          },
          "description": "Distância entre as linhas = desperdício (request muito acima do uso) ou risco (uso encostando no request). Esta é a evidência usada no ciclo de rightsizing descrito em docs/fase5/FINOPS.md."
        },
        {
          "type": "timeseries",
          "title": "Memória: uso real vs. request",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "uso — {{namespace}}",
              "refId": "A"
            },
            {
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{namespace=~\"ngo-namespace|donation-namespace|volunteer-namespace\",resource=\"memory\"})",
              "legendFormat": "request — {{namespace}}",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "📜 Logs centralizados (Loki)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "type": "logs",
          "title": "Erros recentes nos 3 microsserviços",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "{k8s_namespace_name=~\"ngo-namespace|donation-namespace|volunteer-namespace\"} |~ \"(?i)(error|erro|exception|traceback)\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }

    - name: solidarytech.availability
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: |
            up{namespace=~"ngo-namespace|donation-namespace|volunteer-namespace"} == 0
          for: 2m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: '⛔ Alvo indisponível no namespace {{ $labels.namespace }}'
            description: 'O endpoint de métricas/health não responde há mais de 2 minutos. Verifique pod, RDS e credenciais AWS.'

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~".*-namespace"}[10m]) > 3
          for: 5m
          labels:
            severity: warning
            category: stability
          annotations:
            summary: '🔄 Pod {{ $labels.pod }} reiniciando em loop'
            description: 'O pod {{ $labels.pod }} no namespace {{ $labels.namespace }} reiniciou mais de 3 vezes em 10 minutos.'

    - name: solidarytech.resources
      interval: 1m
      rules:
        - alert: HighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{namespace=~".*-namespace", container!="", container!="POD"}
              /
              container_spec_memory_limit_bytes{namespace=~".*-namespace", container!="", container!="POD"}
            ) > 0.9
          for: 5m
          labels:
            severity: warning
            category: resources
          annotations:
            summary: '💾 Memória do container {{ $labels.container }} > 90% do limit'
            description: 'O container {{ $labels.container }} no pod {{ $labels.pod }} está em {{ $value | humanizePercentage }} do memory.limits.'

        - alert: HighCpuUsage
          expr: |
            (
              sum by (namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{namespace=~".*-namespace", container!="", container!="POD"}[5m])
              )
              /
              sum by (namespace, pod, container) (
                kube_pod_container_resource_limits{namespace=~".*-namespace", resource="cpu"}
              )
            ) > 0.85
          for: 10m
          labels:
            severity: warning
            category: resources
          annotations:
            summary: '⚡ CPU do container {{ $labels.container }} > 85% do limit'
            description: 'CPU sustentada alta em {{ $labels.container }} ({{ $value | humanizePercentage }}). O HPA deveria ter escalado — verifique o metrics-server.'